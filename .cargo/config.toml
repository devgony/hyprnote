[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
LLAMA_STATIC = { value = "1", force = true }
LLAMA_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release", force = true }
ORT_STRATEGY = { value = "download", force = true }
ORT_USE_STATIC_RUNTIME = { value = "1", force = true }
# Disable CRT assertions
_CRT_ASSERT = { value = "0", force = true }
_CRT_ERROR = { value = "0", force = true }

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=/SUBSYSTEM:WINDOWS",
  "-C", "link-arg=/ENTRY:mainCRTStartup"
]

[profile.dev]
opt-level = 0
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false
