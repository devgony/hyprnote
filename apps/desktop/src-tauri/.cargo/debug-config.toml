[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Force all C/C++ compilation to use static runtime
CFLAGS = "/MT /D_DEBUG /Od"
CXXFLAGS = "/MT /D_DEBUG /Od"

# CMake configuration for static runtime
CMAKE_CXX_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_C_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
CMAKE_BUILD_TYPE = "Debug"

# Global debug flags
DEBUG = "1"
_DEBUG = "1"

# Force llama-cpp to use static runtime
LLAMA_STATIC = { value = "1", force = true }
LLAMA_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded", force = true }

# ORT static linking
ORT_STRATEGY = { value = "compile", force = true }
