[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=/NODEFAULTLIB:libcmt",
  "-C", "link-arg=/NODEFAULTLIB:msvcrt", 
  "-C", "link-arg=/NODEFAULTLIB:msvcrtd"
]

[env]
# Force all C/C++ compilation to use static runtime
CFLAGS = "/MT /D_DEBUG /Od"
CXXFLAGS = "/MT /D_DEBUG /Od"

# CMake configuration for static runtime
CMAKE_CXX_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_C_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
CMAKE_BUILD_TYPE = "Debug"

# Global debug flags
DEBUG = "1"
_DEBUG = "1"

# ONNX Runtime static linking
ORT_STRATEGY = "download"
ORT_USE_STATIC_RUNTIME = "1"
ORT_CMAKE_ARGS = "-DABSL_MSVC_STATIC_RUNTIME=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

# LLAMA static linking
LLAMA_STATIC = "1"
LLAMA_CMAKE_ARGS = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

