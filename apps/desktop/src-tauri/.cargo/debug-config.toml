[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-C",
    "link-arg=/NODEFAULTLIB:msvcrt",
    "-C",
    "link-arg=/NODEFAULTLIB:msvcrtd",
    "-C",
    "link-arg=/NODEFAULTLIB:libcmtd",
    "-C",
    "link-arg=/FORCE:MULTIPLE"
]

[env]
# Force all C/C++ compilation to use static runtime
CFLAGS = "/MT /D_DEBUG /Od"
CXXFLAGS = "/MT /D_DEBUG /Od"

# CMake configuration for static runtime
CMAKE_CXX_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_C_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
CMAKE_BUILD_TYPE = "Debug"

# Global debug flags
DEBUG = "1"
_DEBUG = "1"

# ONNX Runtime - force static runtime for libort_sys
ORT_STRATEGY = { value = "download", force = true }
ORT_USE_STATIC_RUNTIME = { value = "1", force = true }
ORT_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release -DABSL_MSVC_STATIC_RUNTIME=ON", force = true }
# Force static CRT for all ONNX builds
CXXFLAGS_x86_64_pc_windows_msvc = { value = "/MT", force = true }
CFLAGS_x86_64_pc_windows_msvc = { value = "/MT", force = true }

# LLAMA static linking - force release mode to match ONNX Runtime
LLAMA_STATIC = { value = "1", force = true }
LLAMA_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=/MT -DCMAKE_C_FLAGS=/MT", force = true }

# Sentencepiece static linking
SENTENCEPIECE_SYS_STATIC = "1"

[profile.dev.package.ort]
opt-level = 2
debug = false

[profile.dev.package.ort-sys]
opt-level = 2
debug = false

