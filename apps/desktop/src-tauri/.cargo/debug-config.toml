[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-C",
    "link-arg=/NODEFAULTLIB:msvcrt",
    "-C",
    "link-arg=/NODEFAULTLIB:msvcrtd",
    "-C",
    "link-arg=/NODEFAULTLIB:libcmtd",
    "-C",
    "link-arg=/FORCE:MULTIPLE"
]

[env]
# Force all C/C++ compilation to use static runtime
CFLAGS = "/MT /D_DEBUG /Od"
CXXFLAGS = "/MT /D_DEBUG /Od"

# CMake configuration for static runtime
CMAKE_CXX_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_C_FLAGS = "/MT /D_DEBUG /Od"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
CMAKE_BUILD_TYPE = "Debug"

# Global debug flags
DEBUG = "1"
_DEBUG = "1"

# Disable ONNX Runtime compilation to avoid runtime conflicts
ORT_STRATEGY = { value = "system", force = true }
ORT_USE_STATIC_RUNTIME = { value = "1", force = true }

# LLAMA static linking  
LLAMA_STATIC = { value = "1", force = true }
LLAMA_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release", force = true }

# Sentencepiece static linking
SENTENCEPIECE_SYS_STATIC = "1"

